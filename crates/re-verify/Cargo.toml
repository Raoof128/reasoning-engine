[package]
name = "re-verify"
description = "Claim extraction, verification, the quality gate and attested run packs for the reasoning engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Hybrid (BM25 + embeddings) and NLI verifier tiers. Needs Rust 1.92 (ort)
# and downloads ONNX models on first use unless REASONING_ENGINE_OFFLINE=1.
semantic = ["dep:ort", "dep:tokenizers", "dep:reqwest", "dep:sha2"]
# Ed25519-signed attestations and the transparency-log check (plan Phase 7).
# Evidence graph, counter-search and calibration (plan Phase 10).
graph = ["re-retrieval/graph", "dep:petgraph"]
# Cross-session evidence memory and living reports (plan Phase 11).
learn = ["re-store/learn"]
# Verify claims against open-access full text (plan Phase 9).
fulltext = ["re-retrieval/fulltext"]
trust = ["dep:ed25519-dalek", "dep:getrandom", "dep:base64", "dep:nom", "dep:hayagriva"]

[dependencies]
ed25519-dalek = { workspace = true, optional = true }
petgraph = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
nom = { workspace = true, optional = true }
hayagriva = { workspace = true, optional = true, features = ["archive"] }
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio.workspace = true
re-core.workspace = true
re-model.workspace = true
re-store.workspace = true
re-retrieval.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
wiremock.workspace = true
base64.workspace = true

[lints]
workspace = true
