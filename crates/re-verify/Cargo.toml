[package]
name = "re-verify"
description = "Claim extraction, verification, the quality gate and attested run packs for the reasoning engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Hybrid (BM25 + embeddings) and NLI verifier tiers. Needs Rust 1.92 (ort)
# and downloads ONNX models on first use unless REASONING_ENGINE_OFFLINE=1.
semantic = ["dep:ort", "dep:tokenizers", "dep:reqwest", "dep:sha2", "dep:tokio"]

[dependencies]
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
re-core.workspace = true
re-model.workspace = true
re-store.workspace = true
re-retrieval.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
