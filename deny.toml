# cargo-deny policy. Run: cargo deny check
# Audit optional features too (semantic, local-host, scholar-gateway), so a
# dependency cannot hide behind a feature flag.
[graph]
all-features = true

[advisories]
version = 2
unmaintained = "all"
ignore = [
    # paste is archived (unmaintained, no known vulnerability); it is a
    # compile-time macro pulled in by tokenizers (semantic feature) with no
    # maintained release that drops it yet.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, compile-time only, via tokenizers; revisit on tokenizers 1.0" },
    # quick-xml 0.38 inside citationberg (hayagriva, trust feature): both
    # advisories are denial of service on hostile XML. citationberg only
    # parses the two vendored CSL files compiled into the binary
    # (crates/re-verify/assets/csl, hashes in its README), never network or
    # user input. Network XML (arXiv) goes through quick-xml 0.42, which is
    # not affected. No citationberg release uses a fixed quick-xml yet.
    { id = "RUSTSEC-2026-0194", reason = "DoS on hostile XML; only vendored CSL is parsed; revisit when citationberg updates quick-xml" },
    { id = "RUSTSEC-2026-0195", reason = "DoS on hostile XML; only vendored CSL is parsed; revisit when citationberg updates quick-xml" },
    # unsafe-libyaml (via serde_yaml, via hayagriva, trust feature) is
    # unmaintained; it only ever reads the JSON the engine itself generates
    # for the reference list.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained; parses only engine-generated JSON; revisit when hayagriva drops serde_yaml" },
]
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    # roman-numerals-rs (via hayagriva): public-domain-equivalent.
    "0BSD",
]
confidence-threshold = 0.9
# ISC, MPL-2.0 and friends are needed by crates later phases add.
unused-allowed-license = "allow"
# Mozilla's CA bundle as data, pulled in by reqwest's platform verifier.
# CDLA-Permissive-2.0 is a permissive data licence; scoped to this crate only.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    # The same CA data, used by ort's build-time runtime download (semantic).
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
