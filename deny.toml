# cargo-deny policy. Run: cargo deny check
[graph]
all-features = false

[advisories]
version = 2
unmaintained = "all"
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
]
confidence-threshold = 0.9
# ISC, MPL-2.0 and friends are needed by crates later phases add.
unused-allowed-license = "allow"
# Mozilla's CA bundle as data, pulled in by reqwest's platform verifier.
# CDLA-Permissive-2.0 is a permissive data licence; scoped to this crate only.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
